name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "cv/**"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/prettier.yml"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "cv/**"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/prettier.yml"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Builds the public CV PDF from cv/ (publications come from _bibliography/papers.bib
  # and cv/pending.bib). The deploy job drops it into the site, so the PDF always
  # matches the bib and is never committed.
  cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Check no phone number in the public CV 🔒
        run: |
          if [ -e cv/private.tex ]; then
            echo "::error::cv/private.tex must never be committed (it holds private contact details)."
            exit 1
          fi
          if grep -rnE '^[^%]*\\phone' cv --include=*.tex; then
            echo "::error::Remove \\phone from the CV sources; it belongs in the gitignored cv/private.tex."
            exit 1
          fi
      - name: Build CV 📄
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cv
          root_file: saban-cv.tex
      - name: Upload CV PDF 📤
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: cv/saban-cv.pdf
          if-no-files-found: error

  deploy:
    needs: cv
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Download CV PDF 📥
        uses: actions/download-artifact@v7
        with:
          name: cv-pdf
          path: cv-pdf
      - name: Place CV PDF in the site 📄
        run: |
          mkdir -p assets/pdf
          mv cv-pdf/saban-cv.pdf assets/pdf/michael-t-saban-cv.pdf
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
